<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosori TwinFry 8,6L - Generador de Recetas IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b0f19; color: #f1f5f9; font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .badge-cosori { background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%); }
    </style>
</head>
<body class="min-h-screen antialiased pb-16">

    <header class="border-b border-slate-800 bg-slate-900/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl badge-cosori flex items-center justify-center text-white font-black text-lg">
                    <i class="fa-solid fa-fire-burner"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-base tracking-tight text-white">COSORI TwinFry</h1>
                    <p class="text-[10px] text-slate-400">8,6L Dual Blaze AI Assistant</p>
                </div>
            </div>
            <button onclick="toggleConfig()" class="text-slate-300 hover:text-white p-2 bg-slate-800 rounded-lg border border-slate-700 text-sm">
                <i class="fa-solid fa-gear"></i> Configurar Key
            </button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6 space-y-6">

        <!-- Config Panel -->
        <div id="config-panel" class="hidden glass-panel p-5 rounded-2xl border border-orange-500/30 space-y-3">
            <h3 class="font-bold text-white text-sm flex items-center gap-2">
                <i class="fa-solid fa-key text-orange-400"></i> Tu API Key de Google AI Studio
            </h3>
            <p class="text-xs text-slate-400">Pega aquí tu clave para que la app se comunique con Gemini:</p>
            <div class="flex gap-2">
                <input type="password" id="api-key-input" placeholder="AIzaSy..." class="flex-grow bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-orange-500">
                <button onclick="saveApiKey()" class="bg-orange-600 hover:bg-orange-500 text-white font-bold px-4 py-2 rounded-xl text-sm transition">Guardar</button>
            </div>
        </div>

        <!-- Search Form -->
        <div class="glass-panel rounded-2xl p-6 space-y-4 border border-slate-800">
            <h2 class="text-xl font-extrabold text-white">¿Qué ingredientes tienes hoy?</h2>
            <form onsubmit="handleSearch(event)" class="space-y-3">
                <textarea id="user-prompt" required rows="3" placeholder="Ej: Pechuga de pollo, patatas, aceite, pimentón..." 
                    class="w-full bg-slate-950/80 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 text-sm resize-none"></textarea>
                <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white font-bold py-3 px-6 rounded-xl text-sm transition shadow-lg shadow-orange-600/20 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Generar Recetas Optimizadas
                </button>
            </form>
        </div>

        <!-- Loading -->
        <div id="loading-state" class="hidden py-12 text-center space-y-3">
            <div class="inline-block w-10 h-10 rounded-full border-4 border-orange-500/20 border-t-orange-500 animate-spin"></div>
            <h3 class="text-sm font-bold text-white">Cocinando recetas con IA...</h3>
        </div>

        <!-- Results -->
        <div id="recipes-container" class="space-y-4"></div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('api-key-input').value = savedKey;
            } else {
                document.getElementById('config-panel').classList.remove('hidden');
            }
        });

        function toggleConfig() {
            document.getElementById('config-panel').classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('api-key-input').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('¡Clave guardada con éxito!');
                document.getElementById('config-panel').classList.add('hidden');
            } else {
                alert('Introduce una clave válida.');
            }
        }

        async function handleSearch(e) {
            e.preventDefault();
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                document.getElementById('config-panel').classList.remove('hidden');
                alert('Por favor, configura tu API Key primero.');
                return;
            }

            const prompt = document.getElementById('user-prompt').value.trim();
            const loading = document.getElementById('loading-state');
            const container = document.getElementById('recipes-container');

            loading.classList.remove('hidden');
            container.innerHTML = '';

            const systemPrompt = `Eres un chef experto en la freidora de aire COSORI Dual Blaze TwinFry de 8,6L (doble resistencia superior e inferior). 
Genera 3 recetas detalladas basadas en: "${prompt}".
Devuelve ÚNICAMENTE un array JSON puro que empiece por [ y termine por ], sin markdown ni texto extra.
Estructura de cada objeto:
[
  {
    "titulo": "Nombre",
    "descripcion": "Breve descripción",
    "zonaModo": "Zona Unificada 8.6L o Dual L1/R2",
    "tiempoTotal": "20 min",
    "temperatura": "190°C",
    "ingredientes": ["ing 1", "ing 2"],
    "pasos": ["paso 1", "paso 2"],
    "consejoCosori": "Consejo de la doble resistencia"
  }
]`;

            try {
                // Actualizado al modelo gemini-3.8-flash solicitado
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemPrompt }] }] })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);

                let text = data.candidates[0].content.parts[0].text;
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const start = text.indexOf('[');
                const end = text.lastIndexOf(']');
                const recipes = JSON.parse(text.substring(start, end + 1));

                container.innerHTML = recipes.map(r => `
                    <div class="glass-panel p-5 rounded-2xl border border-slate-800 space-y-3">
                        <div class="flex justify-between items-start">
                            <div>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-orange-500/20 text-orange-400">${r.zonaModo}</span>
                                <h3 class="text-lg font-bold text-white mt-1">${r.titulo}</h3>
                                <p class="text-xs text-slate-400">${r.descripcion}</p>
                            </div>
                            <div class="text-right text-xs text-orange-400 font-bold">
                                <div>${r.temperatura}</div>
                                <div>${r.tiempoTotal}</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs pt-2 border-t border-slate-800">
                            <div><strong class="text-slate-300">Ingredientes:</strong><ul class="list-disc list-inside text-slate-400">${r.ingredientes.map(i=>`<li>${i}</li>`).join('')}</ul></div>
                            <div><strong class="text-slate-300">Pasos:</strong><ol class="list-decimal list-inside text-slate-400">${r.pasos.map(p=>`<li>${p}</li>`).join('')}</ol></div>
                        </div>
                        ${r.consejoCosori ? `<div class="bg-orange-950/30 p-2.5 rounded-lg border border-orange-500/20 text-xs text-orange-200">💡 <strong>Truco Cosori:</strong> ${r.consejoCosori}</div>` : ''}
                    </div>
                `).join('');

            } catch (err) {
                container.innerHTML = `<div class="glass-panel p-4 rounded-xl border border-red-500/30 text-center text-xs text-red-400">Error: ${err.message}</div>`;
            } finally {
                loading.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
