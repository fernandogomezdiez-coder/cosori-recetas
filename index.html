<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Recetas - Cosori Dual Blaze TwinFry</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-4 py-3 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 p-2 rounded-xl text-white">
                    <i class="fa-solid fa-fire-burner text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Cosori TwinFry AI</h1>
                    <p class="text-xs text-slate-400">8,6L Dual Zone Assistant</p>
                </div>
            </div>
            <button onclick="toggleConfig()" class="text-slate-400 hover:text-white p-2">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl w-full mx-auto p-4 space-y-6">

        <!-- Config Panel (API Key) -->
        <div id="configPanel" class="hidden bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg space-y-3">
            <h2 class="font-semibold text-sm text-slate-300 flex items-center gap-2">
                <i class="fa-solid fa-key text-red-500"></i> Configuración de la API Key
            </h2>
            <p class="text-xs text-slate-400">Introduce tu clave API de Google Gemini para que el generador funcione:</p>
            <div class="flex gap-2">
                <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="flex-grow bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-red-500">
                <button onclick="saveApiKey()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-sm font-medium transition">Guardar</button>
            </div>
        </div>

        <!-- Input Form Card -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <h2 class="font-semibold text-base text-white flex items-center gap-2">
                <i class="fa-solid fa-utensils text-red-500"></i> ¿Qué quieres cocinar hoy?
            </h2>

            <!-- Ingredients -->
            <div class="space-y-1">
                <label class="text-xs font-medium text-slate-300">Ingredientes disponibles:</label>
                <textarea id="ingredients" rows="3" placeholder="Ej: Pechuga de pollo, patatas, pimientos, 2 patatas, especias..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-red-500 resize-none"></textarea>
            </div>

            <!-- Mode Selection -->
            <div class="grid grid-cols-2 gap-3">
                <button type="button" onclick="setMode('single')" id="btnSingle" class="p-3 rounded-xl border border-red-500 bg-red-500/10 text-white text-xs font-semibold flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-square text-sm"></i> Zona Única (8,6L)
                </button>
                <button type="button" onclick="setMode('dual')" id="btnDual" class="p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 text-xs font-semibold flex flex-col items-center gap-1 transition">
                    <i class="fa-solid fa-columns text-sm"></i> Dos Zonas (TwinFry)
                </button>
            </div>

            <!-- Generate Button -->
            <button onclick="generateRecipe()" id="generateBtn" class="w-full bg-gradient-to-r from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Generar Receta Optimizada
            </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden flex flex-col items-center justify-center py-10 space-y-3">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-red-500"></div>
            <p class="text-xs text-slate-400">Cocinando la mejor receta para tu Cosori...</p>
        </div>

        <!-- Recipe Output -->
        <div id="recipeResult" class="hidden bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-4">
            <!-- Results injected via JS -->
        </div>

    </main>

    <!-- Script Logic -->
    <script>
        let currentMode = 'single';

        function toggleConfig() {
            const panel = document.getElementById('configPanel');
            panel.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('¡API Key guardada correctamente!');
                toggleConfig();
            } else {
                alert('Por favor, introduce una clave válida.');
            }
        }

        function setMode(mode) {
            currentMode = mode;
            const btnSingle = document.getElementById('btnSingle');
            const btnDual = document.getElementById('btnDual');
            
            if(mode === 'single') {
                btnSingle.className = "p-3 rounded-xl border border-red-500 bg-red-500/10 text-white text-xs font-semibold flex flex-col items-center gap-1 transition";
                btnDual.className = "p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 text-xs font-semibold flex flex-col items-center gap-1 transition";
            } else {
                btnDual.className = "p-3 rounded-xl border border-red-500 bg-red-500/10 text-white text-xs font-semibold flex flex-col items-center gap-1 transition";
                btnSingle.className = "p-3 rounded-xl border border-slate-800 bg-slate-950 text-slate-400 text-xs font-semibold flex flex-col items-center gap-1 transition";
            }
        }

        async function generateRecipe() {
            let apiKey = localStorage.getItem('gemini_api_key');
            if(!apiKey) {
                toggleConfig();
                alert('Por favor, configura primero tu API Key de Gemini.');
                return;
            }

            const ingredients = document.getElementById('ingredients').value.trim();
            if(!ingredients) {
                alert('Por favor, introduce al menos un ingrediente.');
                return;
            }

            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('recipeResult');
            const generateBtn = document.getElementById('generateBtn');

            loading.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            generateBtn.disabled = true;

            const prompt = `Actúa como un chef experto en freidoras de aire de doble compartimento, específicamente en la Cosori Dual Blaze TwinFry de 8,6L. 
            El usuario quiere cocinar con estos ingredientes: "${ingredients}".
            El modo seleccionado es: ${currentMode === 'single' ? 'Zona Única (8,6L sin separación)' : 'Dos Zonas independientes (TwinFry)'}.
            
            Genera una receta adaptada, estructurada y limpia en HTML simple (con etiquetas h3, ul, li, p, strong) que incluya:
            - Título atractivo de la receta.
            - Tiempo y temperatura óptimos adaptados a la tecnología de resistencias duales de la Cosori.
            - Instrucciones paso a paso claras y enfocadas en aprovechar el electrodoméstico.
            No pongas bloques de código markdown tipo html, devuelve etiquetas limpias directamente.`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const textResponse = data.candidates[0].content.parts[0].text;
                resultDiv.innerHTML = textResponse;
                resultDiv.classList.remove('hidden');

            } catch (error) {
                alert('Error al generar la receta: ' + error.message);
            } finally {
                loading.classList.add('hidden');
                generateBtn.disabled = false;
            }
        }

        // Cargar key guardada si existe
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        }
    </script>
</body>
</html>
